<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12110d">
<title>Classeur de mails</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12110d; --s:#1c1a14; --s2:#25221a; --line:#3a3526; --text:#ece8dc; --dim:#9a9482;
    --gold:#c89b3c; --gold2:#e3bd68; --green:#3ddc84; --red:#c4635a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer; background:var(--s2); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
  button:active{opacity:.7;}
  button:disabled{opacity:.45;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 120px;}
  .top{display:flex; align-items:center; gap:12px; padding:16px 0 12px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; border-bottom:1px solid var(--line);}
  .logo{width:42px; height:42px; border-radius:11px; flex:none;}
  .top h1{flex:1; margin:0; font-size:1.45rem; font-weight:600; font-family:Georgia,'Times New Roman',serif; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sq{width:40px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex:none;}
  .back{font-size:1.4rem; line-height:1; padding:6px 14px;}
  input.txt,select.txt{width:100%; padding:13px 14px; background:var(--s2); border:1px solid var(--line); border-radius:10px; font-size:1rem;}
  input.txt:focus,select.txt:focus{outline:none; border-color:var(--gold);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; border-radius:999px; padding:8px 14px; font-size:.9rem; white-space:nowrap;}
  .chip.on{background:var(--gold); color:#1b1405; border-color:var(--gold); font-weight:600;}
  .chip.sub{font-size:.82rem; padding:6px 12px; background:transparent;}
  .chip.sub.on{background:var(--gold2);}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:middle;}
  .card{display:block; width:100%; text-align:left; background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:10px;}
  .card .t{font-weight:600; font-size:1rem; line-height:1.3; word-break:break-word;}
  .card .m{color:var(--dim); font-size:.85rem; margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 12px; word-break:break-all;}
  .tag{background:var(--s2); border:1px solid var(--line); border-radius:999px; padding:1px 9px; color:var(--gold2); font-size:.75rem;}
  .empty{text-align:center; color:var(--dim); padding:50px 10px; line-height:1.6;}
  .big{background:var(--gold); color:#1b1405; border-color:var(--gold); font-weight:600; padding:14px 20px; font-size:1.05rem; border-radius:12px;}
  .danger{color:var(--red); border-color:#6b3a35;}
  .center{max-width:380px; margin:0 auto; padding:70px 22px 40px; text-align:center;}
  .center h2{font-family:Georgia,serif; font-size:1.9rem; margin:14px 0 6px;}
  .center p{color:var(--dim); line-height:1.5; margin:0 0 20px; font-size:.95rem;}
  .center .logo{width:84px; height:84px; border-radius:20px;}
  .center input{text-align:center; letter-spacing:.5em; font-size:1.5rem; margin-bottom:12px;}
  .err{color:var(--red); min-height:1.3em; font-size:.9rem; margin-bottom:10px;}
  .meta{margin-top:14px; background:var(--s); border:1px solid var(--line); border-radius:14px; padding:14px 16px; line-height:1.6; font-size:.92rem; word-break:break-word;}
  .meta b{color:var(--gold2); font-weight:600;}
  .att{display:flex; align-items:center; gap:12px; background:var(--s); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px;}
  .att .th{width:56px; height:56px; border-radius:8px; background:var(--s2); display:flex; align-items:center; justify-content:center; font-size:1.6rem; flex:none; overflow:hidden;}
  .att .th img{width:100%; height:100%; object-fit:cover;}
  .att .nm{flex:1; min-width:0; word-break:break-all; font-size:.92rem;}
  .att .bt{display:flex; flex-direction:column; gap:6px;}
  .att .bt button{padding:6px 12px; font-size:.82rem;}
  .att.ghost{opacity:.6;}
  .sec{margin:18px 0 0; color:var(--dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.06em;}
  .mailbox{margin-top:10px; background:#fff; border-radius:12px; overflow:hidden;}
  .mailbox iframe{width:100%; border:0; display:block; min-height:120px;}
  .mailbox pre{margin:0; padding:14px; white-space:pre-wrap; color:#222; font-family:inherit; word-break:break-word;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .sheet{width:100%; max-width:520px; max-height:88vh; overflow-y:auto; background:var(--s); border-radius:20px 20px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px)); border:1px solid var(--line);}
  .sheet h3{margin:0 0 12px; font-family:Georgia,serif; font-size:1.3rem;}
  .sheet p{color:var(--dim); line-height:1.5; margin:0 0 6px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-top:1px solid var(--line);}
  .row small{display:block; color:var(--dim); margin-top:4px; line-height:1.4;}
  .sw{width:52px; height:30px; border-radius:15px; background:var(--s2); border:1px solid var(--line); position:relative; flex:none; padding:0;}
  .sw::after{content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#888; transition:.2s;}
  .sw.on{background:#2f6b4f; border-color:#2f6b4f;}
  .sw.on::after{left:25px; background:#fff;}
  .btns{display:flex; gap:10px; margin-top:14px;}
  .btns button{flex:1;}
  .pick{display:flex; align-items:center; width:100%; text-align:left; margin-top:8px; padding:13px 14px;}
  .pick.d1{margin-left:18px; width:calc(100% - 18px);}
  .swatches{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 4px;}
  .swatch{width:34px; height:34px; border-radius:50%; padding:0; border:3px solid transparent;}
  .swatch.on{border-color:var(--text);}
  .viewer{position:fixed; inset:0; background:#000; z-index:60; display:flex; flex-direction:column;}
  .viewer .bar{display:flex; gap:10px; padding:12px; padding-top:calc(12px + env(safe-area-inset-top,0px));}
  .viewer .bar .nm{flex:1; align-self:center; font-size:.9rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .viewer .pic{flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .viewer img{max-width:100%; max-height:100%; object-fit:contain; transition:transform .2s;}
  #toast{position:fixed; left:0; right:0; bottom:calc(86px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; z-index:80; pointer-events:none;}
  .toast{background:#2a2820; border:1px solid var(--gold); color:var(--text); padding:10px 18px; border-radius:999px; font-size:.92rem; max-width:90vw; text-align:center;}
  /* À classer */
  .seg{display:flex; gap:8px; margin-top:12px; align-items:center;}
  .seg button{padding:8px 14px; border-radius:999px; font-size:.88rem;}
  .seg button.on{background:var(--gold2); color:#1b1405; border-color:var(--gold2); font-weight:600;}
  .seg .sp{flex:1;}
  .irow{display:flex; gap:10px; align-items:stretch; margin-top:10px;}
  .irow .cb{width:46px; flex:none; border-radius:14px; border:1px solid var(--line); background:var(--s); display:flex; align-items:center; justify-content:center; padding:0;}
  .irow .cb i{width:22px; height:22px; border-radius:6px; border:2px solid var(--dim); display:block; font-style:normal; text-align:center; line-height:18px; font-size:.95rem; color:#1b1405;}
  .irow .cb.on i{background:var(--gold); border-color:var(--gold);}
  .irow .card{margin-top:0; flex:1; min-width:0;}
  .selbar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--s); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; justify-content:center;}
  .selbar button{flex:1; max-width:260px;}
  .conn{margin-top:16px; background:var(--s); border:1px solid var(--line); border-radius:14px; padding:20px 18px; text-align:center; line-height:1.6;}
  .conn p{color:var(--dim); margin:0 0 14px; font-size:.92rem;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const CLIENT_ID = '852424342660-6p4d95ml0vf46f3dtmuqpol15nsrcg5h.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/gmail.modify';
const PALETTE = ['#c1652f','#5f7a5f','#c99a3c','#4f6b8a','#9a5b8f','#5a8f7b','#b25050','#6b6b8f'];

/* ---------- stockage local (IndexedDB) ---------- */
let _db;
function idb(){
  if(_db) return _db;
  _db = new Promise((res,rej)=>{
    const r = indexedDB.open('classeur_mails', 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore('meta'); r.result.createObjectStore('blobs'); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
  return _db;
}
function tx(store, mode, fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const t = db.transaction(store, mode); const r = fn(t.objectStore(store));
    t.oncomplete = ()=>res(r && r.result); t.onerror = ()=>rej(t.error);
  }));
}
const mget = k => tx('meta','readonly',s=>s.get(k));
const mset = (k,v) => tx('meta','readwrite',s=>s.put(v,k));
const mdel = k => tx('meta','readwrite',s=>s.delete(k));
const bget = k => tx('blobs','readonly',s=>s.get(k));
const bset = (k,v) => tx('blobs','readwrite',s=>s.put(v,k));
const bdel = k => tx('blobs','readwrite',s=>s.delete(k));
const bclear = () => tx('blobs','readwrite',s=>s.clear());

/* ---------- chiffrement (code à 6 chiffres) ---------- */
const ITER = 310000;
const b64dec = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function bytesToB64(buf){
  const bytes = new Uint8Array(buf); let bin = ''; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH){ bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH)); }
  return btoa(bin);
}
function b64urlToBytes(s){ s = String(s||'').replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; return b64dec(s); }
async function derive(code, salt){
  const km = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function encBytes(k, buf){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, buf);
  return {iv, ct};
}
const decBytes = (k, r) => crypto.subtle.decrypt({name:'AES-GCM', iv:r.iv}, k, r.ct);

/* ---------- état ---------- */
let key = null, data = null, keepExp = 0, idleT = null;
let view = {tab:null, sub:null, q:'', open:null, inboxOpen:null};
function defaultTab(){ const t = data && topTabs()[0]; return t ? t.id : 'inbox'; }
let urls = [];
let tabMap = {}, kids = {}, topOf = {};

function toast(t){
  const el = $('#toast'); el.innerHTML = '<div class="toast">'+esc(t)+'</div>';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ el.innerHTML=''; }, 3000);
}
function closeModal(){ $('#modal').innerHTML = ''; }
function openModal(html){ $('#modal').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet">'+html+'</div></div>'; }
function resetIdle(){
  clearTimeout(idleT);
  if(!key || keepExp > Date.now()) return;
  idleT = setTimeout(()=>{ if(key && !(keepExp > Date.now()) && !busy) lockNow(); }, 5*60*1000);
}
['click','touchstart','keydown'].forEach(e=>document.addEventListener(e, resetIdle, {passive:true}));
let busy = false;

/* ---------- démarrage ---------- */
async function boot(){
  preloadGsi();
  const auth = await mget('auth');
  if(!auth) return renderSetup();
  const keep = await mget('keep');
  if(keep && keep.exp > Date.now()){
    try{
      key = await crypto.subtle.importKey('raw', keep.raw, 'AES-GCM', true, ['encrypt','decrypt']);
      keepExp = keep.exp; await loadData(); await gLoadToken(); return renderMain();
    }catch(e){ key = null; }
  }
  renderLock('');
}
async function loadData(){
  const d = await mget('data');
  data = d ? JSON.parse(dec.decode(await decBytes(key, d))) : {tabs:[], mails:[], importedAt:0};
  if(!data.tabs) data.tabs = []; if(!data.mails) data.mails = [];
  prepare();
}
async function saveData(){
  const clean = {tabs:data.tabs, importedAt:data.importedAt||0, mails:data.mails.map(m=>{ const c = Object.assign({}, m); delete c._ts; delete c._top; delete c._s; return c; })};
  const e = await encBytes(key, enc.encode(JSON.stringify(clean)));
  await mset('data', e);
}

/* ---------- écrans code ---------- */
function renderSetup(msg){
  $('#app').innerHTML = `<div class="center"><img class="logo" src="icon-192.png" alt="">
    <h2>Classeur de mails</h2><p>Choisis un code à 6 chiffres. Il protège tes mails dans ce téléphone et sera demandé à chaque ouverture.</p>
    <input class="txt" id="c1" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">
    <input class="txt" id="c2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······">
    <div class="err" id="err">${esc(msg||'')}</div>
    <button class="big" style="width:100%" onclick="doSetup()">Valider</button></div>`;
}
async function doSetup(){
  const a = $('#c1').value, b = $('#c2').value;
  if(!/^\d{6}$/.test(a)) return renderSetup('Le code doit faire 6 chiffres.');
  if(a !== b) return renderSetup('Les deux codes sont différents.');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  key = await derive(a, salt);
  const check = await encBytes(key, enc.encode('ok'));
  await mset('auth', {salt, check}); await mset('fails', {n:0, until:0});
  data = {tabs:[], mails:[], importedAt:0}; prepare(); renderMain();
}
async function renderLock(msg){
  const f = (await mget('fails')) || {n:0, until:0};
  const wait = Math.ceil((f.until - Date.now())/1000);
  $('#app').innerHTML = `<div class="center"><img class="logo" src="icon-192.png" alt="">
    <h2>Classeur de mails</h2><p>Entre ton code à 6 chiffres.</p>
    <input class="txt" id="code" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="······" ${wait>0?'disabled':''}>
    <div class="err" id="err">${wait>0 ? 'Trop d\'essais. Réessaie dans '+wait+' s.' : esc(msg||'')}</div></div>`;
  const inp = $('#code');
  if(wait > 0){ setTimeout(()=>renderLock(''), Math.min(wait,5)*1000); return; }
  inp.focus();
  inp.addEventListener('input', ()=>{ if(inp.value.length === 6) tryUnlock(inp.value); });
}
async function tryUnlock(code){
  const f = (await mget('fails')) || {n:0, until:0};
  if(f.until > Date.now()) return renderLock('');
  const auth = await mget('auth'); let k = null;
  try{
    const kk = await derive(code, auth.salt);
    if(dec.decode(await decBytes(kk, auth.check)) === 'ok') k = kk;
  }catch(e){ k = null; }
  if(!k){
    f.n++; if(f.n >= 3) f.until = Date.now() + Math.min(3600, 30*Math.pow(2, f.n-3))*1000;
    await mset('fails', f); return renderLock('Code incorrect.');
  }
  key = k; await mset('fails', {n:0, until:0});
  try{ await loadData(); }catch(e){ data = {tabs:[], mails:[], importedAt:0}; prepare(); }
  await gLoadToken();
  resetIdle(); renderMain();
}
async function lockNow(){
  key = null; data = null; keepExp = 0; gToken = null; inboxRows = []; inboxLoaded = false; inboxSel.clear();
  await mdel('keep'); await mdel('gtok');
  view = {tab:null, sub:null, q:'', open:null, inboxOpen:null}; closeModal(); renderLock('');
}

/* ---------- préparation des données ---------- */
function parseDate(s){
  const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'');
  return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : 0;
}
function stripHtml(h){ return String(h||'').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' '); }
function byName(a,b){ return String(a.name||'').localeCompare(String(b.name||''), 'fr', {sensitivity:'base'}); }
function topTabs(){ return data.tabs.filter(t=>!t.parentId || !tabMap[t.parentId]).slice().sort(byName); }
function childTabs(id){ return data.tabs.filter(t=>t.parentId===id).slice().sort(byName); }
function flatTabs(){ const out = []; topTabs().forEach(t=>{ out.push({t, depth:0}); childTabs(t.id).forEach(c=>out.push({t:c, depth:1})); }); return out; }
function prepare(){
  tabMap = {}; kids = {}; topOf = {};
  if(!data) return;
  data.tabs.forEach(t=>{ tabMap[t.id] = t; });
  data.tabs.forEach(t=>{ if(t.parentId && tabMap[t.parentId]){ (kids[t.parentId] = kids[t.parentId] || []).push(t.id); } });
  const top = id => { let t = tabMap[id], n = 0; while(t && t.parentId && tabMap[t.parentId] && n++ < 6) t = tabMap[t.parentId]; return t ? t.id : id; };
  data.mails.forEach(m=>{
    m._ts = m.mailTs || parseDate(m.date); m._top = top(m.tabId);
    m._s = (((m.customTitle||'')+' '+(m.subject||'')+' '+(m.from||'')+' '+(m.body||'')+' '+stripHtml(m.htmlBody)+' '+(m.attachments||[]).map(a=>a.filename).join(' ')+' '+(m.files||[]).map(a=>a.filename).join(' ')).toLowerCase());
  });
  data.mails.sort((a,b)=> (b._ts - a._ts) || ((b.savedAt||0) - (a.savedAt||0)));
}

/* ---------- Connexion Gmail ---------- */
let gToken = null, gTokenExp = 0;
function gsiReady(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
function preloadGsi(){
  if(gsiReady() || !navigator.onLine || document.getElementById('gsiScript')) return;
  const s = document.createElement('script'); s.id = 'gsiScript'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onerror = ()=>{ s.remove(); };
  document.head.appendChild(s);
}
function loadGsi(){
  return new Promise((res,rej)=>{
    if(gsiReady()) return res();
    if(!navigator.onLine) return rej(new Error('offline'));
    let s = document.getElementById('gsiScript');
    if(!s){ s = document.createElement('script'); s.id = 'gsiScript'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; document.head.appendChild(s); }
    const t0 = Date.now();
    const iv = setInterval(()=>{ if(gsiReady()){ clearInterval(iv); res(); } else if(Date.now()-t0 > 10000){ clearInterval(iv); rej(new Error('timeout')); } }, 150);
  });
}
async function gSaveToken(){
  try{ const e = await encBytes(key, enc.encode(JSON.stringify({t:gToken, e:gTokenExp}))); await mset('gtok', e); }catch(e){}
}
async function gLoadToken(){
  try{
    const r = await mget('gtok'); if(!r) return;
    const o = JSON.parse(dec.decode(await decBytes(key, r)));
    if(o && o.t && o.e > Date.now() + 120000){ gToken = o.t; gTokenExp = o.e; } else await mdel('gtok');
  }catch(e){}
}
async function gConnect(){
  try{
    await loadGsi();
    const hint = (await mget('ghint')) || undefined;
    await new Promise((res,rej)=>{
      const client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE, hint: hint,
        callback: r=>{ if(r && r.access_token){ gToken = r.access_token; gTokenExp = Date.now() + ((+r.expires_in||3600) - 60)*1000; res(); } else rej(new Error((r && r.error) || 'refus')); },
        error_callback: e=>rej(new Error((e && e.type) || 'popup'))
      });
      client.requestAccessToken({prompt:''});
    });
    gSaveToken();
    if(!(await mget('ghint'))){ try{ const pr = await gapi('profile'); if(pr && pr.emailAddress) await mset('ghint', pr.emailAddress); }catch(e){} }
    return true;
  }catch(e){
    toast(navigator.onLine ? 'Connexion à Gmail impossible. Réessaie.' : 'Pas d\'internet');
    return false;
  }
}
async function gapi(path, opts){
  opts = opts || {};
  if(!gToken || Date.now() > gTokenExp){ gToken = null; throw {code:'auth'}; }
  const r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/' + path, Object.assign({}, opts, {headers:Object.assign({Authorization:'Bearer ' + gToken}, opts.headers||{})}));
  if(r.status === 401){ gToken = null; throw {code:'auth'}; }
  if(!r.ok) throw {code:'http', status:r.status};
  return r.status === 204 ? null : r.json();
}
function hdr(msg, name){
  const h = ((msg.payload && msg.payload.headers) || []).find(x=>String(x.name).toLowerCase() === name.toLowerCase());
  return h ? h.value : '';
}
function fmtDate(ms){ return new Date(+ms).toLocaleDateString('fr-FR', {timeZone:'Europe/Paris', day:'2-digit', month:'2-digit', year:'numeric'}); }
function decodeWords(v){
  return String(v||'').replace(/=\?([^?]+)\?([BbQq])\?([^?]*)\?=/g, (m,cs,en,tx)=>{
    try{
      let bytes;
      if(en.toUpperCase()==='B') bytes = b64dec(tx);
      else { const s = tx.replace(/_/g,' ').replace(/=([0-9A-Fa-f]{2})/g, (a,h)=>String.fromCharCode(parseInt(h,16))); bytes = Uint8Array.from(s, c=>c.charCodeAt(0)); }
      return new TextDecoder(cs).decode(bytes);
    }catch(e){ return m; }
  });
}

/* ---------- À classer (boîte de réception) ---------- */
let inboxRows = [], inboxLoaded = false, inboxLoading = false, inboxError = null, inboxNext = null, inboxScope = 'primary';
const inboxSel = new Set();
async function loadInbox(more){
  if(inboxLoading) return;
  inboxLoading = true; inboxError = null; renderBody();
  try{
    let q = 'messages?maxResults=25&labelIds=INBOX';
    if(inboxScope === 'primary') q += '&q=' + encodeURIComponent('category:primary');
    if(more && inboxNext) q += '&pageToken=' + encodeURIComponent(inboxNext);
    const list = await gapi(q);
    const ids = ((list && list.messages) || []).map(m=>m.id);
    inboxNext = (list && list.nextPageToken) || null;
    const rows = new Array(ids.length);
    let i = 0;
    const worker = async ()=>{ while(i < ids.length){ const k = i++; const p = 'messages/' + ids[k] + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date';
      try{ const m = await gapi(p); rows[k] = {id:m.id, subject:decodeWords(hdr(m,'Subject')), from:decodeWords(hdr(m,'From')), ts:+m.internalDate||0, snippet:m.snippet||''}; }catch(e){ if(e && e.code === 'auth') throw e; rows[k] = null; } } };
    await Promise.all([worker(), worker(), worker(), worker(), worker()]);
    const add = rows.filter(Boolean);
    inboxRows = more ? inboxRows.concat(add.filter(r=>!inboxRows.some(x=>x.id === r.id))) : add;
    inboxLoaded = true;
  }catch(e){
    inboxError = (e && e.code === 'auth') ? 'auth' : 'http';
  }
  inboxLoading = false; renderTop(); renderBody();
}
function setScope(s){ if(inboxScope === s) return; inboxScope = s; inboxRows = []; inboxLoaded = false; inboxNext = null; inboxSel.clear(); renderTop(); renderBody(); if(gToken) loadInbox(false); }
function refreshInbox(){ inboxSel.clear(); inboxNext = null; if(gToken && Date.now() > gTokenExp) gToken = null; if(!gToken){ connectAndLoad(); } else loadInbox(false); }
async function connectAndLoad(){ if(await gConnect()){ inboxRows = []; inboxLoaded = false; inboxNext = null; loadInbox(false); } else renderBody(); }
function toggleSel(id){ if(inboxSel.has(id)) inboxSel.delete(id); else inboxSel.add(id); renderBody(); }
function selectAllInbox(){ if(inboxSel.size === inboxRows.length) inboxSel.clear(); else inboxRows.forEach(r=>inboxSel.add(r.id)); renderBody(); }
function inboxHtml(){
  const seg = `<div class="seg"><button class="${inboxScope==='primary'?'on':''}" onclick="setScope('primary')">Principale</button><button class="${inboxScope==='all'?'on':''}" onclick="setScope('all')">Tout</button><span class="sp"></span><button onclick="refreshInbox()" aria-label="Actualiser">↻</button></div>`;
  if(!gToken){
    const off = !navigator.onLine;
    return seg + `<div class="conn"><p>${off ? 'Pas d\'internet : la boîte de réception n\'est pas accessible. Tes mails déjà rangés restent lisibles.' : (inboxError === 'auth' ? 'La connexion à Gmail a expiré.' : 'Connecte-toi à Gmail pour voir les mails à classer.')}</p>
      ${off ? '' : '<button class="big" onclick="connectAndLoad()">Se connecter à Gmail</button>'}</div>`;
  }
  if(inboxLoading && !inboxRows.length) return seg + '<div class="empty">Chargement de ta boîte…</div>';
  if(inboxError && !inboxRows.length) return seg + '<div class="empty">Impossible de charger ta boîte.<br><br><button onclick="refreshInbox()">Réessayer</button></div>';
  if(!inboxRows.length) return seg + '<div class="empty">Rien à classer : ta boîte est à zéro. 🎉</div>';
  const all = inboxSel.size === inboxRows.length;
  const rows = inboxRows.map(r=>`<div class="irow"><button class="cb ${inboxSel.has(r.id)?'on':''}" onclick="toggleSel('${r.id}')" aria-label="Sélectionner"><i>${inboxSel.has(r.id)?'✓':''}</i></button>
    <button class="card" onclick="openInbox('${r.id}')"><div class="t">${esc(r.subject || '(sans objet)')}</div><div class="m"><span>${esc(fmtDate(r.ts))}</span><span>${esc(r.from)}</span></div></button></div>`).join('');
  return seg + `<div class="seg"><button onclick="selectAllInbox()">${all?'Tout désélectionner':'Tout sélectionner'}</button></div>` + rows +
    (inboxNext ? `<div class="empty" style="padding:20px"><button onclick="loadInbox(true)" ${inboxLoading?'disabled':''}>${inboxLoading?'Chargement…':'Charger plus de mails'}</button></div>` : '');
}
function selBarHtml(){
  if(view.tab !== 'inbox' || !inboxSel.size) return '';
  return `<div class="selbar"><button class="big" onclick="pickTabFor([...inboxSel])">Ranger (${inboxSel.size})</button><button class="danger" onclick="confirmTrash([...inboxSel])">Corbeille (${inboxSel.size})</button></div>`;
}

/* aperçu d'un mail de la boîte */
let inboxMsg = null;
function parseMessage(msg){
  const out = {plain:'', html:'', atts:[]};
  const walk = p=>{
    const mt = String(p.mimeType||'').toLowerCase();
    const cid = ((p.headers||[]).find(h=>String(h.name).toLowerCase()==='content-id')||{}).value;
    const dispo = (((p.headers||[]).find(h=>String(h.name).toLowerCase()==='content-disposition')||{}).value||'').toLowerCase();
    if(p.filename && p.body && (p.body.attachmentId || p.body.data)){
      if(!(cid && /^image\//.test(mt) && dispo.indexOf('attachment') < 0)) out.atts.push({filename:decodeWords(p.filename), contentType:mt, attachmentId:p.body.attachmentId, data:p.body.data});
    } else if(mt === 'text/plain' && p.body && p.body.data){ out.plain += textOf(p); }
    else if(mt === 'text/html' && p.body && p.body.data){ out.html += textOf(p); }
    (p.parts||[]).forEach(walk);
  };
  if(msg.payload) walk(msg.payload);
  return out;
}
function textOf(p){
  const ct = ((p.headers||[]).find(h=>String(h.name).toLowerCase()==='content-type')||{}).value || '';
  const m = /charset="?([^";\s]+)/i.exec(ct); let cs = m ? m[1] : 'utf-8';
  const bytes = b64urlToBytes(p.body.data);
  try{ return new TextDecoder(cs).decode(bytes); }catch(e){ return new TextDecoder('utf-8').decode(bytes); }
}
async function openInbox(id){
  view.inboxOpen = id; inboxMsg = null; history.pushState({i:id}, ''); renderMain(); window.scrollTo(0,0);
  try{
    const msg = await gapi('messages/' + id + '?format=full');
    if(view.inboxOpen !== id) return;
    const p = parseMessage(msg);
    inboxMsg = {id, subject:decodeWords(hdr(msg,'Subject')), from:decodeWords(hdr(msg,'From')), ts:+msg.internalDate||0, plain:p.plain, html:p.html, atts:p.atts, raw:msg};
  }catch(e){ inboxMsg = {id, error:true, auth:(e && e.code==='auth')}; }
  if(view.inboxOpen === id) renderMain();
}
function closeInbox(){ if(history.state && history.state.i){ history.back(); } else { view.inboxOpen = null; renderMain(); } }
function renderInboxDetail(){
  const r = inboxRows.find(x=>x.id === view.inboxOpen) || {};
  const m = inboxMsg;
  const bar = topBar('<button class="back" onclick="closeInbox()">←</button>', esc((m && m.subject) || r.subject || 'Mail'));
  let body = '<div class="empty">Chargement du mail…</div>';
  if(m && m.error) body = `<div class="empty">${m.auth ? 'La connexion à Gmail a expiré.<br><br><button class="big" onclick="reconnectOpen()">Se reconnecter</button>' : 'Impossible de charger ce mail.'}</div>`;
  else if(m){
    const nAtt = m.atts.length;
    body = `<div class="meta"><b>De :</b> ${esc(m.from)}<br><b>Date :</b> ${esc(fmtDate(m.ts))}</div>
      ${nAtt ? '<div class="sec">Pièces jointes ('+nAtt+')</div>'+m.atts.map(a=>`<div class="att"><div class="th">${/^image\//.test(a.contentType)?'🖼️':/pdf/.test(a.contentType)?'📕':'📄'}</div><div class="nm">${esc(a.filename)}</div></div>`).join('') : ''}
      <div class="sec">Mail</div><div class="mailbox">${m.html ? '<iframe id="mf" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>' : '<pre>'+esc(m.plain || '(mail vide)')+'</pre>'}</div>
      <div class="btns"><button class="big" onclick="pickTabFor(['${esc(m.id)}'])">Ranger dans…</button><button class="danger" onclick="confirmTrash(['${esc(m.id)}'])">Corbeille</button></div>
      <p style="color:var(--dim);font-size:.8rem;margin-top:10px">« Ranger » enregistre le mail dans l'appli puis le retire de ta boîte de réception.</p>`;
  }

async function reconnectOpen(){ if(await gConnect()){ const id = view.inboxOpen; openInbox(id); } }
function mountFrame(fr, html){
  if(!fr) return;
  fr.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"><base target="_blank"><meta http-equiv="Content-Security-Policy" content="script-src \'none\'; object-src \'none\'; img-src data: blob:; form-action \'none\'"><style>body{margin:12px;font-family:system-ui,sans-serif;color:#222;background:#fff;word-break:break-word}img{max-width:100%;height:auto}table{max-width:100%}</style></head><body>' + html + '</body></html>';
  fr.onload = ()=>{ try{ fr.style.height = (fr.contentDocument.documentElement.scrollHeight + 8) + 'px'; }catch(e){ fr.style.height = '70vh'; } };
}

/* ranger / corbeille */
function tabListHtml(onpick){
  const items = flatTabs();
  if(!items.length) return '<p>Tu n\'as pas encore d\'onglet. Crée-en un pour commencer.</p>';
  return items.map(({t,depth})=>`<button class="pick ${depth?'d1':''}" onclick="${onpick}('${t.id}')"><span class="dot" style="background:${esc(t.color||'#999')}"></span>${esc(t.name)}</button>`).join('');
}
function pickTabFor(ids){
  pendingIds = ids;
  openModal(`<h3>Ranger dans…</h3>${tabListHtml('doFile')}<div class="btns"><button onclick="openTabForm(null, null, true)">+ Nouvel onglet</button><button onclick="closeModal()">Annuler</button></div>`);
}
let pendingIds = [];
async function doFile(tabId){
  const ids = pendingIds.slice(); if(!ids.length) return;
  busy = true; let ok = 0, fail = 0;
  for(let i=0;i<ids.length;i++){
    openModal(`<h3>Rangement…</h3><p>Mail ${i+1} sur ${ids.length}. Ne ferme pas l'appli.</p>`);
    try{ await fileOne(ids[i], tabId); ok++; }catch(e){ fail++; if(e && e.code === 'auth') break; }
  }
  busy = false; closeModal();
  inboxRows = inboxRows.filter(r=>!(ids.indexOf(r.id) >= 0 && data.mails.some(m=>m.gmailId === r.id)));
  ids.forEach(id=>{ if(!inboxRows.some(r=>r.id===id)) inboxSel.delete(id); });
  prepare();
  if(view.inboxOpen && !inboxRows.some(r=>r.id===view.inboxOpen)){ view.inboxOpen = null; if(history.state && history.state.i) history.back(); }
  renderMain();
  toast(fail ? (ok + ' rangé(s), ' + fail + ' échec(s)') : (ok === 1 ? 'Mail rangé ✓' : ok + ' mails rangés ✓'));
}
async function fileOne(gid, tabId){
  const msg = await gapi('messages/' + gid + '?format=full');
  const p = parseMessage(msg);
  const files = [];
  for(let i=0;i<p.atts.length;i++){
    const a = p.atts[i]; let b64u = a.data;
    if(!b64u && a.attachmentId){ const r = await gapi('messages/' + gid + '/attachments/' + a.attachmentId); b64u = r && r.data; }
    if(!b64u) throw {code:'att'};
    const bytes = b64urlToBytes(b64u);
    const fid = 'a_' + gid + '_' + i;
    const e = await encBytes(key, bytes.buffer);
    await bset(fid, {iv:e.iv, ct:e.ct, type:a.contentType, name:a.filename});
    files.push({id:fid, filename:a.filename, contentType:a.contentType});
  }
  const ts = +msg.internalDate || Date.now();
  const mail = {id:'g_' + gid, gmailId:gid, tabId, subject:decodeWords(hdr(msg,'Subject')), from:decodeWords(hdr(msg,'From')), date:fmtDate(ts), mailTs:ts,
    body: p.plain || stripHtml(p.html), htmlBody:p.html || '', files, attachments:files.map(f=>({filename:f.filename, contentType:f.contentType})),
    savedAt:Date.now(), viewUrl:'https://mail.google.com/mail/u/0/#all/' + gid};
  data.mails = data.mails.filter(m=>m.gmailId !== gid); data.mails.push(mail);
  prepare(); await saveData();
  await gapi('messages/' + gid + '/trash', {method:'POST'});
}
function confirmTrash(ids){
  pendingIds = ids;
  openModal(`<h3>Mettre à la corbeille ?</h3><p>${ids.length === 1 ? 'Ce mail sera déplacé' : ids.length + ' mails seront déplacés'} dans la corbeille de Gmail, sans être enregistré dans l'appli.</p>
    <div class="btns"><button onclick="closeModal()">Annuler</button><button class="danger" onclick="doTrash()">Mettre à la corbeille</button></div>`);
}
async function doTrash(){
  const ids = pendingIds.slice(); busy = true; let ok = 0;
  openModal('<h3>Corbeille…</h3><p>Ne ferme pas l\'appli.</p>');
  for(const id of ids){ try{ await gapi('messages/' + id + '/trash', {method:'POST'}); ok++; inboxRows = inboxRows.filter(r=>r.id !== id); inboxSel.delete(id); }catch(e){ if(e && e.code === 'auth') break; } }
  busy = false; closeModal();
  if(view.inboxOpen && !inboxRows.some(r=>r.id===view.inboxOpen)){ view.inboxOpen = null; if(history.state && history.state.i) history.back(); }
  renderMain(); toast(ok + ' mail(s) à la corbeille');
}

/* ---------- onglets ---------- */
let tabForm = null;
function openTabForm(id, parentId, returnToPick){

    <div class="swatches">${PALETTE.map(c=>`<button class="swatch ${c===tabForm.color?'on':''}" style="background:${c}" onclick="pickColor('${c}')" aria-label="Couleur"></button>`).join('')}</div>
    <div class="sec" style="margin-top:12px">Dossier parent</div>
    <select class="txt" id="tfParent" ${t && kids[t.id] ? 'disabled' : ''}>${opts}</select>

function pickColor(c){ tabForm.color = c; document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('on', b.style.background.replace(/\s/g,'') === hexToRgb(c))); }
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return 'rgb('+(n>>16)+','+((n>>8)&255)+','+(n&255)+')'; }
function closeTabForm(){ if(tabForm && tabForm.returnToPick) pickTabFor(pendingIds); else showTabs(); }
async function saveTabForm(){
  const name = ($('#tfName').value || '').trim().toUpperCase();

  const parentId = ($('#tfParent').value || '') || null;
  if(tabForm.id){ const t = tabMap[tabForm.id]; t.name = name; t.color = tabForm.color; if(!kids[t.id]){ if(parentId) t.parentId = parentId; else delete t.parentId; } }
  else { const t = {id:'t' + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36), name, color:tabForm.color}; if(parentId) t.parentId = parentId; data.tabs.push(t); }

function showTabs(){

      ${depth?'':`<button onclick="openTabForm(null,'${t.id}')" aria-label="Sous-dossier" title="Sous-dossier">＋</button>`}<button onclick="openTabForm('${t.id}')" aria-label="Modifier">✏️</button><button onclick="confirmDelTab('${t.id}')" aria-label="Supprimer">🗑</button></div>`;
  }).join('');
  openModal(`<h3>Mes onglets</h3>${rows || '<p>Aucun onglet pour l\'instant.</p>'}<div class="btns"><button class="big" onclick="openTabForm(null,null)">+ Nouvel onglet</button><button onclick="closeModal()">Fermer</button></div>`);

function confirmDelTab(id){

window.addEventListener('popstate', ()=>{
  if(!key) return;
  if(view.open){ view.open = null; renderMain(); }
  else if(view.inboxOpen){ view.inboxOpen = null; renderMain(); }
});
function closeMail(){ if(history.state && history.state.m){ history.back(); } else { view.open = null; renderMain(); } }
function revokeUrls(){ urls.forEach(u=>URL.revokeObjectURL(u)); urls = []; }
async function blobFor(f){
  const r = await bget(f.id); if(!r) return null;
  return new Blob([await decBytes(key, r)], {type: f.contentType || r.type || 'application/octet-stream'});
}
function renderDetail(){
  const m = data.mails.find(x=>x.id === view.open);
  if(!m){ view.open = null; return renderMain(); }
  const title = esc(m.customTitle || m.subject || '(sans objet)');
  const files = m.files || [];
  const savedNames = files.map(f=>(f.filename||'').toLowerCase());
  const ghosts = (m.attachments||[]).filter(a=>savedNames.indexOf((a.filename||'').toLowerCase()) < 0);
  const html = m.htmlBody ? '<iframe id="mf" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>'
    : `<pre>${esc(m.body || '(mail vide)')}</pre>`;
  const opts = flatTabs().map(({t,depth})=>`<option value="${t.id}" ${t.id===m.tabId?'selected':''}>${depth?'↳ ':''}${esc(t.name)}</option>`).join('');
  $('#app').innerHTML = `<div class="wrap">${topBar('<button class="back" onclick="closeMail()">←</button>', title)}
    <div class="meta"><b>De :</b> ${esc(m.from||'')}<br><b>Date :</b> ${esc(m.date||'')}${tabMap[m.tabId]?'<br><b>Onglet :</b> '+esc(tabMap[m.tabId].name):''}${m.customTitle ? '<br><b>Objet d\'origine :</b> '+esc(m.subject||'') : ''}</div>
    ${files.length ? '<div class="sec">Pièces jointes enregistrées</div><div id="files"></div>' : ''}
    ${ghosts.length ? '<div class="sec">Seulement dans Gmail (non enregistrées)</div>'+ghosts.map(a=>`<div class="att ghost"><div class="th">📄</div><div class="nm">${esc(a.filename)}</div></div>`).join('') : ''}
    <div class="sec">Mail</div><div class="mailbox">${html}</div>
    ${m.viewUrl ? `<div class="btns"><button onclick="openGmail('${esc(m.id)}')">Voir le mail original dans Gmail</button></div><p style="color:var(--dim);font-size:.8rem;margin-top:8px">Demande internet.</p>` : ''}
    <div class="sec">Gérer ce mail</div>
    <div class="btns"><button onclick="renameMail('${esc(m.id)}')">✏️ Renommer</button></div>
    <div class="sec" style="margin-top:14px">Déplacer vers un autre onglet</div>
    <select class="txt" id="moveSel" style="margin-top:8px">${opts}</select>
    <div class="btns"><button onclick="moveMail('${esc(m.id)}')">Déplacer</button><button class="danger" onclick="confirmDelMail('${esc(m.id)}')">Supprimer du classeur</button></div></div>`;
  if(m.htmlBody) mountFrame($('#mf'), m.htmlBody);
  if(files.length) fillFiles(files);
}
async function fillFiles(files){
  const box = $('#files'); if(!box) return;
  const out = [];
  for(const f of files){
    let th = '📄'; const isImg = /^image\//.test(f.contentType||'');
    if(isImg){ try{ const b = await blobFor(f); if(b){ const u = URL.createObjectURL(b); urls.push(u); th = `<img src="${u}" alt="">`; } }catch(e){} }
    else if(/pdf/.test(f.contentType||'')) th = '📕';
    out.push(`<div class="att"><div class="th">${th}</div><div class="nm">${esc(f.filename||'fichier')}</div>
      <div class="bt"><button onclick="openFile('${esc(f.id)}')">Ouvrir</button><button onclick="saveFile('${esc(f.id)}')">Télécharger</button></div></div>`);
  }
  box.innerHTML = out.join('');
}
function findFile(id){ for(const m of data.mails){ for(const f of (m.files||[])) if(f.id === id) return f; } return null; }
async function openFile(id){
  const f = findFile(id); if(!f) return;
  const b = await blobFor(f); if(!b){ toast('Fichier absent de cet appareil'); return; }
  const u = URL.createObjectURL(b); urls.push(u);
  if(/^image\//.test(b.type)){
    openModal('');
    $('#modal').innerHTML = `<div class="viewer"><div class="bar"><button onclick="closeModal()">Fermer</button><div class="nm">${esc(f.filename||'')}</div><button onclick="rotImg()">Tourner</button></div>
      <div class="pic"><img id="vimg" src="${u}" data-r="0" alt=""></div></div>`;
  } else {
    const w = window.open(u, '_blank'); if(!w) saveFile(id);
  }
}
function rotImg(){ const i = $('#vimg'); const r = ((+i.dataset.r) + 90) % 360; i.dataset.r = r; i.style.transform = 'rotate('+r+'deg)'; }
async function saveFile(id){
  const f = findFile(id); if(!f) return;
  const b = await blobFor(f); if(!b){ toast('Fichier absent de cet appareil'); return; }
  const u = URL.createObjectURL(b); const a = document.createElement('a');
  a.href = u; a.download = f.filename || 'fichier'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 10000);
}
function openGmail(id){
  const m = data.mails.find(x=>x.id === id); if(!m || !m.viewUrl) return;
  const w = window.open(m.viewUrl, '_blank'); if(!w) location.href = m.viewUrl;
}
function renameMail(id){
  const m = data.mails.find(x=>x.id === id); if(!m) return;
  openModal(`<h3>Renommer ce mail</h3><input class="txt" id="rnInput" placeholder="Nouveau nom" maxlength="120" value="${esc(m.customTitle||m.subject||'')}">
    <div class="btns"><button onclick="closeModal()">Annuler</button><button class="big" onclick="saveRename('${esc(id)}')">Enregistrer</button></div>`);
}
async function saveRename(id){
  const m = data.mails.find(x=>x.id === id); if(!m) return;
  const v = ($('#rnInput').value || '').trim();
  if(!v || v === m.subject) delete m.customTitle; else m.customTitle = v;
  prepare(); await saveData(); closeModal(); renderMain();
}
async function moveMail(id){
  const m = data.mails.find(x=>x.id === id); if(!m) return;
  const to = $('#moveSel').value; if(!to || to === m.tabId){ toast('Choisis un autre onglet'); return; }
  m.tabId = to; prepare(); await saveData(); toast('Mail déplacé ✓'); renderMain();
}
function confirmDelMail(id){
  openModal(`<h3>Supprimer ce mail ?</h3><p>Il sera supprimé du classeur (et de ses pièces jointes enregistrées). Cette action est définitive.</p>
    <div class="btns"><button onclick="closeModal()">Annuler</button><button class="danger" onclick="delMail('${esc(id)}')">Supprimer</button></div>`);
}
async function delMail(id){
  const m = data.mails.find(x=>x.id === id); if(!m) return;
  for(const f of (m.files||[])){ try{ await bdel(f.id); }catch(e){} }
  data.mails = data.mails.filter(x=>x.id !== id); prepare(); await saveData(); closeModal();
  view.open = null; if(history.state && history.state.m){ history.back(); } else renderMain();
  toast('Mail supprimé');
}

/* ---------- réglages, sauvegarde, import ---------- */
function fmtExp(t){ return new Date(t).toLocaleString('fr-FR', {weekday:'long', hour:'2-digit', minute:'2-digit'}); }
function showSettings(){
  const n = data ? data.mails.length : 0;
  const when = data && data.importedAt ? new Date(data.importedAt).toLocaleDateString('fr-FR') : '';
  openModal(`<h3>Réglages</h3>
    <div class="row"><div><b>Rester déverrouillé 24 h</b><small>${keepExp > Date.now() ? 'Actif jusqu\'à '+esc(fmtExp(keepExp))+'. Le code n\'est pas demandé : quiconque a ton téléphone peut ouvrir l\'appli.' : 'Le code est demandé à chaque ouverture.'}</small></div>
      <button class="sw ${keepExp > Date.now() ? 'on' : ''}" onclick="toggleKeep()" aria-label="Rester déverrouillé 24 h"></button></div>
    <div class="row"><div><b>Gmail</b><small>${gToken ? 'Connecté.' : 'Non connecté (connexion à chaque ouverture).'}</small></div>
      ${gToken ? '<button onclick="gDisconnect()">Déconnecter</button>' : '<button onclick="closeModal(); setTab(\'inbox\'); connectAndLoad();">Connecter</button>'}</div>
    <div class="row"><div><b>Mes onglets</b><small>Créer, renommer, colorer, supprimer.</small></div><button onclick="showTabs()">Gérer</button></div>
    <div class="row"><div><b>Sauvegarde</b><small>${n} mails dans ce téléphone${when?' · import du '+when:''}. Fais une sauvegarde de temps en temps : si le téléphone est perdu, les mails rangés le sont aussi.</small></div>
      <button onclick="exportBackup()">Sauvegarder</button></div>
    <div class="row"><div><b>Restaurer</b><small>Remplace tout par le contenu d'un fichier de sauvegarde.</small></div><button onclick="pickFile()">Importer</button></div>
    <div class="btns"><button onclick="closeModal()">Fermer</button></div>`);
}
function gDisconnect(){
  const t = gToken; mdel('gtok'); gToken = null; inboxRows = []; inboxLoaded = false; inboxSel.clear();
  try{ if(t && gsiReady()) google.accounts.oauth2.revoke(t, ()=>{}); }catch(e){}
  closeModal(); renderTop(); renderBody(); toast('Déconnecté de Gmail');
}
async function toggleKeep(){
  if(keepExp > Date.now()){ await mdel('keep'); keepExp = 0; toast('Le code sera redemandé'); }
  else { const raw = await crypto.subtle.exportKey('raw', key); keepExp = Date.now() + 864e5; await mset('keep', {raw, exp:keepExp}); toast('Déverrouillé pendant 24 h'); }
  showSettings();
}
async function exportBackup(){
  busy = true; openModal('<h3>Sauvegarde…</h3><p>Préparation du fichier. Ne ferme pas l\'appli.</p>');
  try{
    const files = [];
    for(const m of data.mails){ for(const f of (m.files||[])){
      const r = await bget(f.id); if(!r) continue;
      files.push({id:f.id, filename:f.filename, contentType:f.contentType, b64:bytesToB64(await decBytes(key, r))});
    } }
    const clean = data.mails.map(m=>{ const c = Object.assign({}, m); delete c._ts; delete c._top; delete c._s; return c; });
    const blob = new Blob([JSON.stringify({version:1, exportedAt:Date.now(), tabs:data.tabs, mails:clean, files})], {type:'application/json'});
    const u = URL.createObjectURL(blob); const a = document.createElement('a'); const d = new Date();
    a.href = u; a.download = 'classeur-sauvegarde-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 20000);
    busy = false; closeModal(); toast('Sauvegarde créée ✓');
  }catch(e){ busy = false; openModal('<h3>Sauvegarde impossible</h3><div class="btns"><button onclick="closeModal()">Fermer</button></div>'); }
}
function pickFile(){
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = ()=>{ const f = i.files && i.files[0]; if(!f) return;
    if(data && data.mails.length){
      openModal(`<h3>Remplacer les mails ?</h3><p>Les ${data.mails.length} mails actuellement dans l'appli seront remplacés par ceux du fichier.</p>
        <div class="btns"><button onclick="closeModal()">Annuler</button><button class="big" id="go">Remplacer</button></div>`);
      $('#go').onclick = ()=>doImport(f);
    } else doImport(f);
  };
  i.click();
}
async function doImport(file){
  busy = true; openModal('<h3>Import en cours…</h3><p>Ne ferme pas l\'appli.</p>');
  try{
    const j = JSON.parse(await file.text());
    if(!j || !Array.isArray(j.mails) || !Array.isArray(j.tabs)) throw new Error('format');
    await bclear();
    for(const f of (j.files || [])){
      const e = await encBytes(key, b64dec(f.b64).buffer);
      await bset(f.id, {iv:e.iv, ct:e.ct, type:f.contentType, name:f.filename});
    }
    data = {tabs:j.tabs, mails:j.mails, importedAt:Date.now()};
    prepare(); await saveData();
    view = {tab:null, sub:null, q:'', open:null, inboxOpen:null};
    busy = false; closeModal(); renderMain(); toast(data.mails.length + ' mails importés');
  }catch(e){
    busy = false;
    openModal('<h3>Import impossible</h3><p>Ce fichier n\'est pas le bon. Choisis un fichier de sauvegarde du classeur.</p><div class="btns"><button onclick="closeModal()">Fermer</button></div>');
  }
}

if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
boot();
</script>
